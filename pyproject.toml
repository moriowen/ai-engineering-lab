[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "Experiments, system designs, and notes on how production AI systems are built, optimized, evaluated, and scaled."
readme = "README.md"
requires-python = ">=3.11"
# Keep core deps empty. Picking a stack is part of the experiments.
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Add per-domain deps here as experiments need them, e.g. `uv sync --extra retrieval`.
retrieval = []
optimization = []
agents = []
evals = []
security = []
model = []
production = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests", "0*-*/*/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
